<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Dynamic title based on whether we're adding or editing a student -->
    <title th:text="${student.id == null ? 'Add New Student' : 'Edit Student'}"></title>

    <!-- Bootstrap CSS for modern styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Custom CSS for additional styling -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Student Management System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/students}">Student List</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" th:href="@{/students/new}">Add Student</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <!-- Dynamic heading for Add/Edit form -->
                        <h2 class="mb-0" th:text="${student.id == null ? 'Add New Student' : 'Edit Student'}"></h2>
                    </div>
                    <div class="card-body">
                        <!--
                            Thymeleaf form for creating or updating a student.
                            th:object binds the form to the 'student' object passed from the controller.
                            th:action dynamically sets the form submission URL:
                            - If student.id is null (new student), it posts to /students.
                            - If student.id is not null (existing student), it posts to /students/{id} for update.
                            method="post" is used for both create and update operations (Spring handles PUT/POST internally based on ID presence).
                        -->
                        <form th:action="${student.id == null ? '/students' : '/students/' + student.id}"
                              th:object="${student}" method="post">

                            <!-- Hidden input for student ID. Essential for distinguishing between create and update operations. -->
                            <input type="hidden" th:field="*{id}" />

                            <!-- First Name Field -->
                            <div class="mb-3">
                                <label for="firstName" class="form-label">First Name</label>
                                <input type="text" class="form-control"
                                       th:field="*{firstName}"
                                       th:classappend="${#fields.hasErrors('firstName') ? 'is-invalid' : ''}"
                                       id="firstName" placeholder="Enter first name" required>
                                <!-- Display validation errors for first name -->
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">
                                    First Name Error
                                </div>
                            </div>

                            <!-- Last Name Field -->
                            <div class="mb-3">
                                <label for="lastName" class="form-label">Last Name</label>
                                <input type="text" class="form-control"
                                       th:field="*{lastName}"
                                       th:classappend="${#fields.hasErrors('lastName') ? 'is-invalid' : ''}"
                                       id="lastName" placeholder="Enter last name" required>
                                <!-- Display validation errors for last name -->
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">
                                    Last Name Error
                                </div>
                            </div>

                            <!-- Email Field -->
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control"
                                       th:field="*{email}"
                                       th:classappend="${#fields.hasErrors('email') ? 'is-invalid' : ''}"
                                       id="email" placeholder="Enter email address" required>
                                <!-- Display validation errors for email -->
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                    Email Error
                                </div>
                            </div>

                            <!-- Date of Birth Field -->
                            <div class="mb-3">
                                <label for="dateOfBirth" class="form-label">Date of Birth</label>
                                <input type="date" class="form-control"
                                       th:field="*{dateOfBirth}"
                                       th:classappend="${#fields.hasErrors('dateOfBirth') ? 'is-invalid' : ''}"
                                       id="dateOfBirth" required>
                                <!-- Display validation errors for date of birth -->
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}">
                                    Date of Birth Error
                                </div>
                            </div>

                            <!-- Phone Number Field -->
                            <div class="mb-3">
                                <label for="phoneNumber" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control"
                                       th:field="*{phoneNumber}"
                                       th:classappend="${#fields.hasErrors('phoneNumber') ? 'is-invalid' : ''}"
                                       id="phoneNumber" placeholder="e.g., 123-456-7890">
                                <!-- Display validation errors for phone number -->
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}">
                                    Phone Number Error
                                </div>
                            </div>

                            <!-- Address Field -->
                            <div class="mb-3">
                                <label for="address" class="form-label">Address</label>
                                <textarea class="form-control"
                                          th:field="*{address}"
                                          th:classappend="${#fields.hasErrors('address') ? 'is-invalid' : ''}"
                                          id="address" rows="3" placeholder="Enter student's address"></textarea>
                                <!-- Display validation errors for address -->
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}">
                                    Address Error
                                </div>
                            </div>

                            <!-- Form Submission Buttons -->
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                <a th:href="@{/students}" class="btn btn-secondary me-md-2">Cancel</a>
                                <button type="submit" class="btn btn-primary">
                                    <span th:text="${student.id == null ? 'Add Student' : 'Save Changes'}">Save Student</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-auto py-3 bg-light">
        <div class="container text-center">
            <span class="text-muted">&copy; 2023 Student Management System. All rights reserved.</span>
        </div>
    </footer>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
