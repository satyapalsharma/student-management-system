<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Students</title>

    <!-- Bootstrap CSS CDN for modern styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <!-- Custom CSS for project-specific styles -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Navigation Bar: Provides consistent navigation across the application -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/students}">Student Management System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <!-- 'active' class highlights the current page -->
                        <a class="nav-link active" aria-current="page" th:href="@{/students}">Students</a>
                    </li>
                    <!-- Future navigation items can be added here, e.g., for Grades -->
                    <!--
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/grades}">Grades</a>
                    </li>
                    -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Area: Contains the student list, search, and add functionality -->
    <main class="container my-4">
        <h2 class="mb-4 text-center">Student List</h2>

        <!-- Search and Add Student Section -->
        <div class="row mb-3 align-items-center">
            <div class="col-md-6">
                <!-- Search Form: Submits a GET request to filter students by keyword -->
                <form th:action="@{/students}" method="get" class="d-flex">
                    <input type="text" name="keyword" class="form-control me-2" placeholder="Search by name or email" th:value="${keyword}">
                    <button type="submit" class="btn btn-outline-primary">Search</button>
                    <!-- Clear Search Button: Resets the search by navigating to the base students URL -->
                    <a th:href="@{/students}" class="btn btn-outline-secondary ms-2">Clear</a>
                </form>
            </div>
            <div class="col-md-6 text-end">
                <!-- Add New Student Button: Navigates to the student creation form -->
                <a th:href="@{/students/new}" class="btn btn-success">Add New Student</a>
            </div>
        </div>

        <!-- Conditional rendering for student table: Shows message if no students found -->
        <div th:if="${students.isEmpty()}" class="alert alert-info text-center" role="alert">
            No students found.
        </div>

        <!-- Student Table: Displays a list of students with their details and actions -->
        <div th:unless="${students.isEmpty()}" class="table-responsive">
            <table class="table table-striped table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name
