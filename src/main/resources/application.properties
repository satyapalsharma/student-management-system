# Spring Boot Application Properties for Student Management System

# --- Application Core Settings ---
# Defines the name of the application. Useful for monitoring and logging.
spring.application.name=student-management-system

# --- Server Configuration ---
# The port on which the embedded server will listen.
# Default is 8080. Change if another application uses this port or for specific deployment needs.
server.port=8080

# --- H2 Database Configuration (Development Profile) ---
# H2 is an in-memory database, ideal for development and testing due to its simplicity and speed.
# For production, a robust external database (e.g., PostgreSQL, MySQL) should be used.

# Database URL:
# `jdbc:h2:mem:smsdb` specifies an in-memory database named 'smsdb'.
# `DB_CLOSE_DELAY=-1` keeps the database alive until the JVM exits, even if all connections are closed.
# `DB_CLOSE_ON_EXIT=FALSE` prevents the database from closing when the application shuts down,
# which is useful for debugging or if the application restarts quickly.
spring.datasource.url=jdbc:h2:mem:smsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration:
# Enables the H2 database console, accessible via a web browser.
# IMPORTANT: This should be DISABLED in production environments for security reasons.
spring.h2.console.enabled=true
# Specifies the path where the H2 console will be accessible.
spring.h2.console.path=/h2-console

# --- JPA / Hibernate Configuration ---
# Java Persistence API (JPA) settings, managed by Hibernate (the default JPA provider in Spring Boot).

# Specifies the dialect for the H2 database, optimizing Hibernate's SQL generation.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# `ddl-auto` property controls schema generation.
# - `none`: No DDL operations. Recommended for production with external schema management (e.g., Flyway, Liquibase).
# - `update`: Updates the schema based on entity changes. Good for development, but can be risky in production.
# - `create-drop`: Creates schema on startup and drops it on shutdown. Ideal for testing.
# - `create`: Creates schema on startup.
spring.jpa.hibernate.ddl-auto=update

# Shows all SQL statements executed by Hibernate. Extremely useful for debugging and performance tuning.
# Set to `false` in production to avoid excessive logging overhead.
spring.jpa.show-sql=true
# Formats the SQL statements shown by `show-sql` for better readability.
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf Configuration ---
# Thymeleaf is the templating engine used for rendering HTML views.

# Disables Thymeleaf template caching.
# Set to `false` during development to see template changes immediately without restarting the application.
# Set to `true` in production for better performance.
spring.thymeleaf.cache=false

# Specifies the prefix for Thymeleaf template locations.
# `classpath:/templates/` means templates are located in the `src/main/resources/templates` directory.
spring.thymeleaf.prefix=classpath:/templates/
# Specifies the suffix for Thymeleaf template files.
spring.thymeleaf.suffix=.html

# --- Logging Configuration ---
# Configures logging levels for different parts of the application.

# Sets the default logging level for the application's packages.
# `DEBUG` provides detailed information, useful during development.
# `INFO` is a good default for production.
logging.level.com.example.sms=DEBUG

# Sets the logging level for Spring Framework components.
# `INFO` is generally sufficient for production.
logging.level.org.springframework=INFO

# Sets the logging level for Hibernate.
# `WARN` suppresses verbose Hibernate internal logs, focusing on potential issues.
# Set to `DEBUG` or `TRACE` if detailed JPA/Hibernate debugging is needed.
logging.level.org.hibernate=WARN
# Specifically for SQL logging, if `spring.jpa.show-sql` is false, this can be used.
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE # To see parameter bindings
# logging.level.org.hibernate.type.descriptor.sql.BasicExtractor=TRACE # To see result set extraction